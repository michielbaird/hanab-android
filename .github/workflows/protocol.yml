# The app's types for hanab.live's wire protocol come from the website's own contracts, the `hanabi_protocol` crate on
# crates.io (native/protocol, scripts/protocol.sh). This keeps them honest:
#   generated  Protocol.kt is what the generator writes for the pinned crate version (nobody edited it, the pin and the file moved together)
#   deployed   a newer crate is published, or the website that is live has a protocol the pin does not: this run fails and lists what changed
#              (then: scripts/protocol.sh bump, fix what the build and the unit tests show, commit)
name: protocol

on:
  push:
    paths: ['native/protocol/**', 'app/src/main/java/live/hanab/client/protocol/**', 'scripts/protocol.ps1', 'scripts/protocol.sh', '.github/workflows/protocol.yml']
  pull_request:
    paths: ['native/protocol/**', 'app/src/main/java/live/hanab/client/protocol/**', 'scripts/protocol.ps1', 'scripts/protocol.sh', '.github/workflows/protocol.yml']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol.kt matches the pinned crate version
        run: ./scripts/protocol.sh check

  deployed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The pin is up to date with the crate and the live website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/protocol.sh outdated
